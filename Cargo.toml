[package]
name = "decker"
version = "0.1.0"
edition = "2021"
description = "Interface with a Stream Deck Plus to control for Elgato Key Lights and MPRIS media"

[dependencies]
elgato-streamdeck = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fontdue = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1"
zbus = "5"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }

[profile.release]
opt-level = 2
strip = true
